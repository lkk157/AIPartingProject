server:
  port: 8080

spring:
  application:
    name: parking-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:parking}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    # 生产环境必须通过环境变量覆盖，长度 >= 32 字节
    secret: ${JWT_SECRET:parking-dev-secret-key-please-change-in-prod}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
    issuer: parking-server
  init-admin:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
